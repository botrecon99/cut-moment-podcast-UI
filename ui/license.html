<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaughDetectionV2 · License</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#203b66 0%,#0b1423 55%,#080d18 100%);color:#e8f1ff;font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}.card{max-width:470px;width:100%;padding:34px;border:1px solid #334865;border-radius:17px;background:#121e30;box-shadow:0 28px 80px #0007}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2f78ea,#14a3a6);font-size:26px;margin-bottom:16px}h1{font-size:24px;margin:0 0 5px}p{color:#a6b9d5;margin:0 0 23px}.muted{color:#91aac7;font-size:12px}label{font-weight:650;font-size:12px;display:block;margin-bottom:7px}input{width:100%;background:#0b1524;color:#eaf3ff;border:1px solid #405574;padding:13px;border-radius:9px;font:14px ui-monospace,Consolas,monospace;outline:none}input:focus{border-color:#65a5fa}button{cursor:pointer;background:#2563eb;color:white;font:700 14px system-ui;border:0;border-radius:9px;padding:13px;width:100%;margin-top:12px}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}.foot{border-top:1px solid #2e415b;margin-top:22px;padding-top:15px}.error{color:#ff9db1}.ok{color:#7ee7aa}#message{min-height:22px;margin:10px 0 0;font-size:13px;overflow-wrap:anywhere}
</style></head><body><main class="card"><div class="logo">🔑</div><h1>LaughDetectionV2</h1><p>Kích hoạt bản quyền để sử dụng Parallel Laugh Studio.</p><div id="activationForm" hidden><label for="key">LICENSE KEY</label><input id="key" type="text" placeholder="LDS-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" autocomplete="off" spellcheck="false"><button id="activate">Kích hoạt</button></div><button id="retry" style="background:#243751">Kiểm tra lại / Đã gia hạn</button><button id="changeKey" style="background:#1b2a41" hidden>Đổi License Key</button><div id="message" role="status"></div><div class="foot"><div id="status" class="muted">Đang kiểm tra license…</div><div class="muted" style="margin-top:8px">Mỗi key dành cho một máy. Khi hết hạn, dữ liệu video và clip trên máy không bị xóa.</div></div></main>
<script>
const $=id=>document.getElementById(id);
let editingKey=false;
function showStatus(d){
  const saved=Boolean(d.has_key);
  $('activationForm').hidden=saved&&!editingKey;
  $('changeKey').hidden=!saved;
  $('status').textContent=(saved?'Key đã được ghi nhớ trên máy này. ':'')+(d.message||'Chưa có thông tin');
  if(d.expires_at){let t=new Date(d.expires_at*1000);$('status').textContent+=' · Hạn '+t.toLocaleString('vi-VN');}
  if(d.valid)location.replace('/');
}
async function request(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});let d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||d.message||'Không kết nối được Studio');return d;}
async function activate(){let key=$('key').value.trim().toUpperCase();$('activate').disabled=true;$('message').textContent='Đang xác thực license…';$('message').className='';try{let d=await request('/api/license-activate',{key});$('message').textContent=d.message||'Kích hoạt thành công';$('message').className='ok';showStatus(d);}catch(e){$('message').textContent=e.message;$('message').className='error';}finally{$('activate').disabled=false;}}
async function refresh(){try{let d=await request('/api/license-refresh',{});$('message').textContent=d.message;$('message').className=d.valid?'ok':'error';showStatus(d);}catch(e){$('message').textContent=e.message;$('message').className='error';}}
$('changeKey').addEventListener('click',()=>{editingKey=true;$('activationForm').hidden=false;$('key').focus()});$('activate').addEventListener('click',activate);$('key').addEventListener('keydown',e=>{if(e.key==='Enter')activate()});$('retry').addEventListener('click',refresh);
fetch('/api/license-status').then(r=>r.json()).then(showStatus).catch(e=>{$('status').textContent='Không kiểm tra được trạng thái: '+e.message});
</script></body></html>
